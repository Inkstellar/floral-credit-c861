<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Placeholder image showing an AI-assisted design system workflow pipeline">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D4FF3F"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#0F0F12"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="1600" height="54" fill="#141418"/>
  <line x1="0" y1="54" x2="1600" y2="54" stroke="#25252B" stroke-width="1"/>
  <circle cx="30" cy="27" r="6" fill="#34343C"/>
  <circle cx="52" cy="27" r="6" fill="#34343C"/>
  <circle cx="74" cy="27" r="6" fill="#34343C"/>
  <rect x="112" y="16" width="330" height="22" rx="11" fill="#1B1B20"/>
  <text x="128" y="31" font-family="monospace" font-size="12" fill="#8A8A94">token-pipeline / workflow.graph</text>

  <!-- header -->
  <text x="72" y="132" font-family="sans-serif" font-size="30" font-weight="600" fill="#F2F2EE" letter-spacing="-0.6">Token &amp; handover pipeline</text>
  <text x="72" y="162" font-family="monospace" font-size="12" fill="#8A8A94" letter-spacing="0.7">runs on every merge to main &#183; median 94s end to end</text>

  <rect x="1290" y="108" width="238" height="38" rx="19" fill="#D4FF3F" opacity="0.14" stroke="#D4FF3F"/>
  <circle cx="1318" cy="127" r="5" fill="#D4FF3F"/>
  <text x="1336" y="132" font-family="monospace" font-size="12" fill="#D4FF3F" letter-spacing="1">PIPELINE GREEN</text>

  <!-- flow nodes -->
  <rect x="72" y="230" width="256" height="150" rx="12" fill="#141418" stroke="#25252B"/>
  <text x="96" y="264" font-family="monospace" font-size="10.5" fill="#8A8A94" letter-spacing="1.4">STEP 01</text>
  <text x="96" y="300" font-family="sans-serif" font-size="18" font-weight="600" fill="#F2F2EE">Figma variables</text>
  <text x="96" y="328" font-family="monospace" font-size="11" fill="#8A8A94" letter-spacing="0.6">read on merge</text>
  <text x="96" y="350" font-family="monospace" font-size="11" fill="#8A8A94" letter-spacing="0.6">no manual export</text>

  <line x1="336" y1="305" x2="404" y2="305" stroke="#D4FF3F" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="412" y="230" width="256" height="150" rx="12" fill="#141418" stroke="#25252B"/>
  <text x="436" y="264" font-family="monospace" font-size="10.5" fill="#8A8A94" letter-spacing="1.4">STEP 02</text>
  <text x="436" y="300" font-family="sans-serif" font-size="18" font-weight="600" fill="#F2F2EE">Diff &amp; validate</text>
  <text x="436" y="328" font-family="monospace" font-size="11" fill="#8A8A94" letter-spacing="0.6">contrast checked</text>
  <text x="436" y="350" font-family="monospace" font-size="11" fill="#8A8A94" letter-spacing="0.6">naming rules enforced</text>

  <line x1="676" y1="305" x2="744" y2="305" stroke="#D4FF3F" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="752" y="230" width="256" height="150" rx="12" fill="#141418" stroke="#D4FF3F" stroke-width="2"/>
  <text x="776" y="264" font-family="monospace" font-size="10.5" fill="#D4FF3F" letter-spacing="1.4">STEP 03</text>
  <text x="776" y="300" font-family="sans-serif" font-size="18" font-weight="600" fill="#F2F2EE">AI review pass</text>
  <text x="776" y="328" font-family="monospace" font-size="11" fill="#8A8A94" letter-spacing="0.6">flags breaking changes</text>
  <text x="776" y="350" font-family="monospace" font-size="11" fill="#8A8A94" letter-spacing="0.6">drafts release notes</text>

  <line x1="1016" y1="305" x2="1084" y2="305" stroke="#D4FF3F" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="1092" y="230" width="256" height="150" rx="12" fill="#141418" stroke="#25252B"/>
  <text x="1116" y="264" font-family="monospace" font-size="10.5" fill="#8A8A94" letter-spacing="1.4">STEP 04</text>
  <text x="1116" y="300" font-family="sans-serif" font-size="18" font-weight="600" fill="#F2F2EE">Publish</text>
  <text x="1116" y="328" font-family="monospace" font-size="11" fill="#8A8A94" letter-spacing="0.6">npm package + docs</text>
  <text x="1116" y="350" font-family="monospace" font-size="11" fill="#8A8A94" letter-spacing="0.6">consumers notified</text>

  <!-- metrics strip -->
  <rect x="72" y="440" width="616" height="150" rx="14" fill="#141418" stroke="#25252B"/>
  <text x="102" y="476" font-family="monospace" font-size="11" fill="#8A8A94" letter-spacing="1.4">MANUAL EFFORT REMOVED</text>
  <text x="102" y="540" font-family="sans-serif" font-size="52" font-weight="700" fill="#D4FF3F" letter-spacing="-2">11h</text>
  <text x="290" y="540" font-family="monospace" font-size="12" fill="#8A8A94" letter-spacing="0.8">per sprint, across</text>
  <text x="290" y="562" font-family="monospace" font-size="12" fill="#8A8A94" letter-spacing="0.8">3 designers + 4 engineers</text>

  <rect x="712" y="440" width="616" height="150" rx="14" fill="#141418" stroke="#25252B"/>
  <text x="742" y="476" font-family="monospace" font-size="11" fill="#8A8A94" letter-spacing="1.4">HANDOVER DOCS</text>
  <text x="742" y="540" font-family="sans-serif" font-size="52" font-weight="700" fill="#D4FF3F" letter-spacing="-2">0</text>
  <text x="800" y="540" font-family="monospace" font-size="12" fill="#8A8A94" letter-spacing="0.8">written by hand</text>
  <text x="800" y="562" font-family="monospace" font-size="12" fill="#8A8A94" letter-spacing="0.8">&#8594; generated from the source of truth</text>

  <!-- trade-offs -->
  <rect x="1352" y="440" width="176" height="150" rx="14" fill="#141418" stroke="#25252B"/>
  <text x="1376" y="476" font-family="monospace" font-size="11" fill="#8A8A94" letter-spacing="1.4">TRADE-OFFS</text>
  <text x="1376" y="508" font-family="monospace" font-size="11" fill="#8A8A94" letter-spacing="0.6">&#8226; review fatigue</text>
  <text x="1376" y="532" font-family="monospace" font-size="11" fill="#8A8A94" letter-spacing="0.6">&#8226; false positives</text>
  <text x="1376" y="556" font-family="monospace" font-size="11" fill="#8A8A94" letter-spacing="0.6">&#8226; needs guardrails</text>

  <!-- output log -->
  <rect x="72" y="626" width="1456" height="164" rx="14" fill="#0F0F12" stroke="#25252B"/>
  <text x="102" y="662" font-family="monospace" font-size="11" fill="#8A8A94" letter-spacing="1.4">RUN LOG</text>
  <text x="102" y="696" font-family="monospace" font-size="12.5" fill="#8A8A94">read 214 variables &#183; 0 conflicts</text>
  <text x="102" y="722" font-family="monospace" font-size="12.5" fill="#8A8A94">validated 38 components &#183; 2 contrast warnings auto-fixed</text>
  <text x="102" y="748" font-family="monospace" font-size="12.5" fill="#D4FF3F">published v3.2.0 &#183; 9 consumers notified &#183; 94s total</text>
  <text x="102" y="774" font-family="monospace" font-size="12" fill="#5E5E68" letter-spacing="0.6">reviewed and approved by a human before publish</text>

  <!-- sample stamp -->
  <rect x="1218" y="858" width="302" height="30" rx="6" fill="#0F0F12" stroke="#D4FF3F" stroke-dasharray="5 4"/>
  <text x="1236" y="878" font-family="monospace" font-size="11" fill="#D4FF3F" letter-spacing="1.4">SAMPLE IMAGE &#8212; REPLACE ME</text>
</svg>
